<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testers Ranking</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <aside class="tray">
    <header class="tray-header">
      <h1 class="tray-title" id="appTitle">Testers Ranking</h1>
      <button type="button" class="btn" id="addImageBtn">+ Add image</button>
      <div class="folder-row" id="folderRow" hidden>
        <button type="button" class="btn btn-ghost" id="folderBtn">Connect folder…</button>
      </div>
    </header>

    <div class="tray-body" id="trayBody" aria-label="Unplaced items">
      <p class="tray-empty" id="trayEmptyMsg" hidden>
        Everything's placed.<br>Hit <strong>Export PNG</strong> below.
      </p>
    </div>

    <footer class="tray-footer">
      <button type="button" class="btn" id="copyBtn">Copy PNG</button>
      <button type="button" class="btn btn-primary" id="exportBtn">Export PNG</button>
    </footer>
  </aside>

  <main class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="building" id="building">
        <img class="bg-image" id="bgImage" alt="" draggable="false">
        <div class="bg-fallback" id="bgFallback" hidden>
          <div class="fallback-floor" data-row="0"><span>Vault</span></div>
          <div class="fallback-floor" data-row="1"><span>Office</span></div>
          <div class="fallback-floor" data-row="2"><span>Dorm</span></div>
          <div class="fallback-floor" data-row="3"><span>Sewer</span></div>
        </div>
        <div class="grid" id="grid"></div>
        <p class="bg-missing-msg" id="bgMissingMsg" hidden>
          <code>assets/background.png</code> is not in place yet &mdash; showing a placeholder layout.
        </p>
      </div>
    </div>
  </main>

</div>

<dialog id="addDialog" class="add-dialog">
  <form method="dialog" id="addForm">
    <h2>Add images</h2>
    <label class="file-field">
      <span>Choose image files</span>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </label>
    <div class="file-rows" id="fileRows"></div>
    <div class="dialog-actions">
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn btn-primary" id="commitBtn" disabled>Add to tray</button>
    </div>
  </form>
</dialog>

<div class="drag-ghost" id="dragGhost" hidden></div>

<canvas id="exportCanvas" width="1024" height="1024" hidden></canvas>

<script src="assets/background-data.js"></script>
<script src="app.js"></script>
</body>
</html>
